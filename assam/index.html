<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Assam Village & District Portal — search 35 districts and 21,032 villages on an interactive OpenStreetMap." />
  <title>Assam Map Portal</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ0kPjS8KQ2H5nQf1LL2jW9a7q1zv7M=" crossorigin="" />
  <style>
    :root {
      color-scheme: light dark;
      --bg:      #f0f4ef;
      --panel:   #ffffff;
      --ink:     #101c16;
      --muted:   #4e6357;
      --border:  #cddacf;
      --accent:  #126a4a;
      --accentH: #0b9960;
      --soft:    #d5ecdf;
      --shadow:  0 2px 16px rgba(18,106,74,.10);
      --r:       10px;
      --topH:    54px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0e1912; --panel:#172318; --ink:#e5f2e8;
        --muted:#87b097; --border:#273d2e; --accent:#3fc47e;
        --accentH:#29a868; --soft:#1b3424;
        --shadow:0 2px 16px rgba(0,0,0,.4);
      }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;width:100%;overflow:hidden;}
    body{background:var(--bg);color:var(--ink);
         font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
         display:flex;flex-direction:column;}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

    /* topbar */
    .topbar{flex-shrink:0;height:var(--topH);background:var(--panel);
            border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;
            padding:0 18px;position:relative;z-index:500;
            box-shadow:0 1px 6px rgba(0,0,0,.07);}
    .brand{display:flex;align-items:center;gap:9px;text-decoration:none;
           color:var(--ink);font-weight:800;font-size:.98rem;letter-spacing:-.03em;}
    .brand-icon{width:30px;height:30px;border-radius:8px;background:var(--accent);
                display:grid;place-items:center;flex-shrink:0;}
    .gh-link{font-size:.82rem;color:var(--muted);text-decoration:none;}
    .gh-link:hover{color:var(--accent);}

    /* controls: tabs + search bar */
    .controls{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
              box-shadow:var(--shadow);position:relative;z-index:400;}
    .tab-bar{display:flex;border-bottom:1px solid var(--border);}
    .tab-btn{flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:7px;
             font:inherit;font-size:.88rem;font-weight:700;
             background:transparent;border:none;color:var(--muted);cursor:pointer;
             border-bottom:3px solid transparent;transition:color .15s,border-color .15s,background .15s;}
    .tab-count{font-size:.73rem;font-weight:500;background:var(--soft);color:var(--accent);
               padding:1px 7px;border-radius:20px;}
    .tab-btn.active{color:var(--accent);border-color:var(--accent);
                    background:color-mix(in srgb,var(--accent) 5%,transparent);}
    .tab-btn:hover:not(.active){color:var(--ink);background:var(--bg);}
    .search-row{display:flex;align-items:center;gap:10px;padding:10px 14px;}
    .search-wrap{flex:1;position:relative;}
    .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
                 color:var(--muted);pointer-events:none;font-size:.95rem;}
    #search-input{width:100%;padding:9px 34px 9px 34px;
                  border:1.5px solid var(--border);border-radius:var(--r);
                  background:var(--bg);color:var(--ink);
                  font:inherit;font-size:.9rem;outline:none;
                  transition:border-color .15s,box-shadow .15s;}
    #search-input:focus{border-color:var(--accent);
                        box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
    #search-input::placeholder{color:var(--muted);}
    #clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);
               background:none;border:none;cursor:pointer;color:var(--muted);
               font-size:.95rem;line-height:1;padding:2px;display:none;}
    #clear-btn:hover{color:var(--ink);}
    #search-count{font-size:.75rem;color:var(--muted);white-space:nowrap;min-width:60px;text-align:right;}

    /* mobile map/list toggle */
    .view-toggle{display:none;gap:0;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
    .view-btn{padding:6px 12px;font:inherit;font-size:.8rem;font-weight:700;
              background:transparent;border:none;cursor:pointer;color:var(--muted);
              transition:background .12s,color .12s;}
    .view-btn.active{background:var(--accent);color:#fff;}
    @media(max-width:768px){.view-toggle{display:flex;}}

    /* main split */
    .portal{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0;height:100%;}
    @media(max-width:768px){
      .portal{display:flex;flex-direction:column;height:100%;}
    }

    /* list pane */
    .list-pane{border-right:1px solid var(--border);display:flex;
               flex-direction:column;background:var(--panel);overflow:hidden;min-height:0;height:100%;}
    @media(max-width:768px){
      .list-pane{border-right:none;flex:1;height:100%;}
      .list-pane.mobile-hidden{display:none !important;}
    }
    .list-scroll{flex:1;overflow-y:auto;}
    .list-scroll::-webkit-scrollbar{width:4px;}
    .list-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

    /* list items */
    .list-ul{list-style:none;}
    .list-item-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
                   padding:11px 14px;background:none;border:none;
                   border-bottom:1px solid var(--border);font:inherit;color:var(--ink);
                   cursor:pointer;transition:background .12s;
                   touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
    .list-item-btn:hover{background:var(--soft);}
    .list-item-btn.highlighted{background:var(--soft);}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent);}
    .v-item .dot{background:#c84010;}
    .item-text{min-width:0;}
    .item-name{font-weight:700;font-size:.87rem;display:block;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .item-meta{font-size:.73rem;color:var(--muted);display:block;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* status row at bottom of list */
    .list-status{padding:8px 14px;font-size:.74rem;color:var(--muted);
                 border-top:1px solid var(--border);flex-shrink:0;
                 display:flex;align-items:center;gap:8px;}
    .spinner{width:12px;height:12px;border:2px solid var(--border);
             border-top-color:var(--accent);border-radius:50%;
             animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spinner.done{display:none;}

    /* empty / no-results */
    .empty-state{padding:36px 20px;text-align:center;color:var(--muted);}
    .empty-state .big{font-size:1.8rem;margin-bottom:8px;}
    .empty-state p{font-size:.85rem;}

    /* map pane */
    #map-pane{position:relative;width:100%;height:100%;min-height:0;}
    @media(max-width:768px){
      #map-pane{flex:1;height:100%;min-height:300px;}
      #map-pane.mobile-hidden{display:none !important;}
    }
    #map{position:absolute;top:0;bottom:0;left:0;right:0;width:100%;height:100%;background:#e4ece6;}

    /* popups */
    .leaflet-popup-content{margin:12px 14px;}
    .pop-name{font-weight:800;font-size:.95rem;margin-bottom:3px;color:#101c16;}
    .pop-meta{color:#526359;font-size:.79rem;margin-bottom:7px;}
    .pop-links{display:flex;gap:6px;flex-wrap:wrap;}
    .pop-link{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:700;
              padding:4px 8px;border-radius:6px;text-decoration:none;
              background:#d5ecdf;color:#126a4a;}
    .pop-link:hover{background:#b5dcca;}
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5" fill="white" stroke="none"/>
      </svg>
    </span>
    Assam Map Portal
  </a>
  <a class="gh-link" href="https://github.com/Angsumi/map" target="_blank" rel="noreferrer">GitHub ↗</a>
</header>

<!-- controls: tabs + search -->
<div class="controls">
  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" id="tab-v" role="tab" aria-selected="true" aria-controls="panel-v">
      🏘️ Villages <span class="tab-count" id="v-count">21,032</span>
    </button>
    <button class="tab-btn" id="tab-d" role="tab" aria-selected="false" aria-controls="panel-d">
      🗺️ Districts <span class="tab-count" id="d-count">35</span>
    </button>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input id="search-input" type="search"
             placeholder="Search villages by name, sub-district or district…"
             autocomplete="off" spellcheck="false" aria-label="Search" />
      <button id="clear-btn" aria-label="Clear search">✕</button>
    </div>
    <span id="search-count" aria-live="polite"></span>
    <div class="view-toggle" role="group" aria-label="Toggle view">
      <button class="view-btn" id="show-map-btn">Map</button>
      <button class="view-btn active" id="show-list-btn">List</button>
    </div>
  </div>
</div>

<!-- main split: list left, map right -->
<main class="portal">

  <div class="list-pane" id="list-pane">
    <div class="list-scroll" id="panel-v" role="tabpanel" aria-labelledby="tab-v">
      <ul class="list-ul" id="village-list" aria-label="Village list">
        <li class="empty-state"><div class="big">⏳</div><p>Loading villages…</p></li>
      </ul>
    </div>
    <div class="list-scroll" id="panel-d" role="tabpanel" aria-labelledby="tab-d" hidden>
      <ul class="list-ul" id="district-list" aria-label="District list"></ul>
    </div>
    <div class="list-status">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Loading…</span>
    </div>
  </div>

  <div id="map-pane" class="mobile-hidden">
    <div id="map"></div>
  </div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ============================================================
   Assam Map Portal — Polygon Boundary Engine
   Renders simplified polygon boundary of ONLY the clicked village / district
   =========================================================== */

// INITIALIZE LEAFLET MAP WITH CANVAS ACCELERATION
const map = L.map('map', {
  zoomControl: false,
  scrollWheelZoom: true,
  preferCanvas: true,
  fadeAnimation: false,
  zoomAnimation: true,
  trackResize: true
});
L.control.zoom({ position: 'topright' }).addTo(map);

// OPENSTREETMAP TILE OPTIONS
const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
  keepBuffer: 4
});

const osmHot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Tiles by <a href="https://www.hotosm.org/">HOT</a>',
  subdomains: 'abc',
  maxZoom: 19,
  keepBuffer: 4
});

const osmCyclOSM = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://www.cyclosm.org">CyclOSM</a>',
  subdomains: 'abc',
  maxZoom: 18,
  keepBuffer: 4
});

const osmTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
  subdomains: 'abc',
  maxZoom: 17,
  keepBuffer: 4
});

const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
  maxZoom: 18,
  keepBuffer: 4
});

osmStandard.addTo(map);

L.control.layers({
  "🗺️ OpenStreetMap Standard": osmStandard,
  "🏥 OSM Humanitarian (HOT)": osmHot,
  "🚲 OSM CyclOSM": osmCyclOSM,
  "⛰️ OSM Topo (OpenTopo)": osmTopo,
  "🛰️ Esri Satellite": esriSatellite
}, null, { position: 'bottomleft' }).addTo(map);

map.setView([26.2, 92.9], 7);

const dStyle = { color: '#0a4f34', weight: 2.5, fillColor: '#3db87a', fillOpacity: .5 };
const vPolyStyle = { color: '#b03000', weight: 2.5, fillColor: '#f05818', fillOpacity: .55 };

// STATE
let currentTab          = 'v';
let districtData        = [];   // [{name, geojson, bounds}]
let villageData         = [];   // [{id, name, sub, district, lat, lng}]
let filteredVillages    = [];
let villageDisplayCount = 80;
let mobilePanelShown    = 'list';
let activeVLayer        = null; // single village polygon layer
let activeDLayer        = null; // single district polygon layer

// CACHE FOR DISTRICT POLYGON JSON FILES
const districtPolygonCache = new Map();

// DOM
const searchInput  = document.getElementById('search-input');
const clearBtn     = document.getElementById('clear-btn');
const searchCount  = document.getElementById('search-count');
const villageList  = document.getElementById('village-list');
const districtList = document.getElementById('district-list');
const panelV       = document.getElementById('panel-v');
const panelD       = document.getElementById('panel-d');
const statusText   = document.getElementById('status-text');
const spinner      = document.getElementById('spinner');
const listPane     = document.getElementById('list-pane');
const mapPane      = document.getElementById('map-pane');
const vCount       = document.getElementById('v-count');
const dCount       = document.getElementById('d-count');

// HELPERS
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gmV(lat,lng){return 'https://www.google.com/maps?q='+lat+','+lng+'&z=14';}
function gmD(n)      {return 'https://www.google.com/maps/search/'+encodeURIComponent(n+' district Assam India');}
function osm(lat,lng){return 'https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lng+'&zoom=15';}
function setStatus(msg,done){statusText.textContent=msg;if(done)spinner.classList.add('done');}
const isMobile=()=>window.innerWidth<=768;

function resizeMap(){
  setTimeout(()=> map.invalidateSize(), 100);
}

function popVillage(name,sub,district,lat,lng){
  const meta=[sub,district].filter(Boolean).join(', ');
  return '<div class="pop-name">'+esc(name)+'</div>'
    +(meta?'<div class="pop-meta">'+esc(meta)+'</div>':'')
    +'<div class="pop-links">'
    +'<a class="pop-link" href="'+gmV(lat,lng)+'" target="_blank" rel="noreferrer">📍 Google Maps</a>'
    +'<a class="pop-link" href="'+osm(lat,lng)+'" target="_blank" rel="noreferrer">🗺 OpenStreetMap</a>'
    +'</div>';
}
function popDistrict(name){
  return '<div class="pop-name">'+esc(name)+'</div>'
    +'<div class="pop-meta">District · Assam</div>'
    +'<div class="pop-links"><a class="pop-link" href="'+gmD(name)+'" target="_blank" rel="noreferrer">📍 Google Maps</a></div>';
}

// CLEAR MAP OVERLAYS
function clearMap(){
  if(activeVLayer){ map.removeLayer(activeVLayer); activeVLayer = null; }
  if(activeDLayer){ map.removeLayer(activeDLayer); activeDLayer = null; }
}

// MOBILE TOGGLE
document.getElementById('show-map-btn').addEventListener('click',()=>{
  mobilePanelShown='map';
  document.getElementById('show-map-btn').classList.add('active');
  document.getElementById('show-list-btn').classList.remove('active');
  listPane.classList.add('mobile-hidden');
  mapPane.classList.remove('mobile-hidden');
  resizeMap();
});
document.getElementById('show-list-btn').addEventListener('click',()=>{
  mobilePanelShown='list';
  document.getElementById('show-list-btn').classList.add('active');
  document.getElementById('show-map-btn').classList.remove('active');
  mapPane.classList.add('mobile-hidden');
  listPane.classList.remove('mobile-hidden');
});
window.addEventListener('resize',()=>{
  if(!isMobile()){
    listPane.classList.remove('mobile-hidden');
    mapPane.classList.remove('mobile-hidden');
  } else {
    if(mobilePanelShown==='map'){listPane.classList.add('mobile-hidden');mapPane.classList.remove('mobile-hidden');}
    else{mapPane.classList.add('mobile-hidden');listPane.classList.remove('mobile-hidden');}
  }
  resizeMap();
});
window.addEventListener('load', resizeMap);

// TAB SWITCH
function switchTab(tab){
  currentTab=tab;
  const isV=tab==='v';
  document.getElementById('tab-v').classList.toggle('active',isV);
  document.getElementById('tab-d').classList.toggle('active',!isV);
  document.getElementById('tab-v').setAttribute('aria-selected',isV);
  document.getElementById('tab-d').setAttribute('aria-selected',!isV);
  panelV.hidden=!isV; panelD.hidden=isV;
  searchInput.placeholder=isV?'Search villages by name, sub-district or district…':'Search districts…';
  searchInput.value=''; clearBtn.style.display='none';
  clearMap();
  document.querySelectorAll('.list-item-btn.highlighted').forEach(b=>b.classList.remove('highlighted'));
  if(isV) filterVillages(''); else filterDistricts('');
  if(isMobile()&&mobilePanelShown==='map') document.getElementById('show-list-btn').click();
  resizeMap();
}
document.getElementById('tab-v').addEventListener('click',()=>switchTab('v'));
document.getElementById('tab-d').addEventListener('click',()=>switchTab('d'));

// SEARCH
searchInput.addEventListener('input',e=>{
  const v=e.target.value;
  clearBtn.style.display=v?'block':'none';
  if(currentTab==='v') filterVillages(v); else filterDistricts(v);
});
clearBtn.addEventListener('click',()=>{
  searchInput.value=''; clearBtn.style.display='none';
  if(currentTab==='v') filterVillages(''); else filterDistricts('');
  searchInput.focus();
});

// ULTRA-FAST VIRTUAL CHUNKED RENDER FOR 21,032 VILLAGES
function renderVillageBatch(){
  const batch = filteredVillages.slice(0, villageDisplayCount);
  villageList.innerHTML = '';
  if(batch.length === 0 && villageData.length > 0){
    const li=document.createElement('li');
    li.className='no-results empty-state';
    li.innerHTML='<div class="big">🔍</div><p>No results for "<strong>'+esc(searchInput.value)+'</strong>"</p>';
    villageList.appendChild(li);
    return;
  }

  const frag = document.createDocumentFragment();
  batch.forEach(item => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'list-item-btn v-item';
    btn.innerHTML = '<span class="dot"></span><span class="item-text"><span class="item-name">'+esc(item.name)+'</span><span class="item-meta">'+esc([item.sub,item.district].filter(Boolean).join(' · '))+'</span></span>';
    btn.addEventListener('click', () => showVillage(item, btn));
    li.appendChild(btn);
    frag.appendChild(li);
  });
  villageList.appendChild(frag);
}

panelV.addEventListener('scroll', () => {
  if (panelV.scrollTop + panelV.clientHeight >= panelV.scrollHeight - 120) {
    if (villageDisplayCount < filteredVillages.length) {
      villageDisplayCount += 60;
      renderVillageBatch();
    }
  }
});

function filterVillages(term){
  const q = term.toLowerCase().trim();
  if(!q){
    filteredVillages = villageData;
  } else {
    filteredVillages = villageData.filter(item =>
      item.name.toLowerCase().includes(q) ||
      item.sub.toLowerCase().includes(q) ||
      item.district.toLowerCase().includes(q)
    );
  }
  villageDisplayCount = 80;
  vCount.textContent = q ? filteredVillages.length.toLocaleString() : villageData.length.toLocaleString();
  searchCount.textContent = q ? filteredVillages.length.toLocaleString()+' / '+villageData.length.toLocaleString() : '';
  renderVillageBatch();
}

function filterDistricts(term){
  const q=term.toLowerCase().trim(); let shown=0;
  districtList.querySelectorAll('li').forEach(li=>{
    const match=!q||(li.dataset.name||'').toLowerCase().includes(q);
    li.hidden=!match; if(match) shown++;
  });
  const total=districtData.length;
  dCount.textContent=q?shown:total;
  searchCount.textContent=q?shown+' / '+total:'';
}

function buildDistrictList(){
  districtList.innerHTML='';
  const frag=document.createDocumentFragment();
  districtData.forEach(item=>{
    const li=document.createElement('li'); li.dataset.name=item.name;
    const btn=document.createElement('button'); btn.className='list-item-btn'; btn.dataset.name=item.name;
    btn.innerHTML='<span class="dot"></span><span class="item-text"><span class="item-name">'+esc(item.name)+'</span><span class="item-meta">District · Assam</span></span>';
    btn.addEventListener('click',()=>showDistrict(item,btn));
    li.appendChild(btn); frag.appendChild(li);
  });
  districtList.appendChild(frag);
  filterDistricts('');
}

// FETCH & CACHE DISTRICT POLYGONS ON DEMAND
function getVillagePolygon(districtName, villageId) {
  const slug = districtName.replace(/[^A-Z0-9]/g, '_');
  if (districtPolygonCache.has(slug)) {
    const dMap = districtPolygonCache.get(slug);
    return Promise.resolve(dMap[String(villageId)] || null);
  }
  return fetch('villages-data/' + slug + '.json')
    .then(r => { if(!r.ok) throw new Error('Polygon load failed'); return r.json(); })
    .then(dMap => {
      districtPolygonCache.set(slug, dMap);
      return dMap[String(villageId)] || null;
    })
    .catch(() => null);
}

// SHOW VILLAGE — RENDER ITS EXACT SIMPLIFIED POLYGON BOUNDARY
function showVillage(item, btn){
  clearMap();
  document.querySelectorAll('.list-item-btn.highlighted').forEach(b=>b.classList.remove('highlighted'));
  if(btn) btn.classList.add('highlighted');

  getVillagePolygon(item.district, item.id).then(vData => {
    if(!vData || !vData.geom) {
      // Fallback if polygon unavailable: show point marker
      activeVLayer = L.circleMarker([item.lat, item.lng], {
        radius: 9, color: '#8a2800', weight: 2.5, fillColor: '#e85010', fillOpacity: .95
      }).addTo(map);
      activeVLayer.bindPopup(popVillage(item.name, item.sub, item.district, item.lat, item.lng), { maxWidth: 240 });
      map.setView([item.lat, item.lng], 14, { animate: true });
      setTimeout(()=> { if(activeVLayer) activeVLayer.openPopup(); }, 100);
      return;
    }

    // Render exact Village Polygon Boundary!
    activeVLayer = L.geoJSON(vData.geom, { style: vPolyStyle }).addTo(map);
    activeVLayer.bindPopup(popVillage(item.name, item.sub, item.district, item.lat, item.lng), { maxWidth: 240 });
    
    if(isMobile()) {
      document.getElementById('show-map-btn').click();
    }
    resizeMap();
    setTimeout(()=>{
      map.fitBounds(activeVLayer.getBounds(), { padding: [40, 40], maxZoom: 15 });
      if(activeVLayer) activeVLayer.openPopup();
    }, 100);
  });
}

// SHOW DISTRICT — RENDER ITS EXACT BOUNDARY POLYGON
function showDistrict(item, btn){
  clearMap();
  document.querySelectorAll('.list-item-btn.highlighted').forEach(b=>b.classList.remove('highlighted'));
  if(btn) btn.classList.add('highlighted');

  activeDLayer = L.geoJSON(item.geojson, { style: dStyle }).addTo(map);
  activeDLayer.bindPopup(popDistrict(item.name), { maxWidth: 220 });
  
  if(isMobile()) {
    document.getElementById('show-map-btn').click();
  }
  resizeMap();
  setTimeout(()=>{
    map.fitBounds(item.bounds, { padding: [40, 40], maxZoom: 11 });
    if(activeDLayer) activeDLayer.openPopup();
  }, 100);
}

// LOAD DATA
function loadDistricts(){
  setStatus('Loading districts…');
  fetch('districts-simple.geojson')
    .catch(()=> fetch('../districts-simple.geojson'))
    .then(r=>{if(!r.ok) throw new Error('District data failed');return r.json();})
    .then(data=>{
      data.features.forEach(f=>{
        const tmp = L.geoJSON(f);
        districtData.push({name: f.properties.name, geojson: f, bounds: tmp.getBounds()});
      });
      districtData.sort((a,b)=>a.name.localeCompare(b.name));
      dCount.textContent=districtData.length;
      buildDistrictList();
      setStatus('Districts ready. Loading villages…');
      loadVillages();
    })
    .catch(err=>setStatus('Error: '+err.message));
}

function loadVillages(){
  fetch('villages-index.json')
    .catch(()=> fetch('villages-slim.json'))
    .then(r=>{if(!r.ok) throw new Error('Village index failed');return r.json();})
    .then(rows=>{
      rows.forEach(r => {
        // format: [id, name, sub, district, lat, lng] or [name, sub, district, lat, lng]
        if (typeof r[0] === 'number') {
          villageData.push({ id: r[0], name: r[1], sub: r[2], district: r[3], lat: r[4], lng: r[5] });
        } else {
          villageData.push({ id: villageData.length, name: r[0], sub: r[1], district: r[2], lat: r[3], lng: r[4] });
        }
      });
      villageData.sort((a,b)=>a.name.localeCompare(b.name));
      vCount.textContent=villageData.length.toLocaleString();
      setStatus(villageData.length.toLocaleString()+' villages ready',true);
      filterVillages('');
      resizeMap();
    })
    .catch(err=>setStatus('Error: '+err.message,true));
}

loadDistricts();
</script>
