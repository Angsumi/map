<script>
  const map = L.map('map', {
    zoomControl: false,
    preferCanvas: true,
    zoomAnimation: false
  });
  L.control.zoom({ position: 'topright' }).addTo(map);

  // DEFAULT BASE LAYER: ESRI SATELLITE
  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics', maxZoom: 18
  }).addTo(map);

  const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 20
  });

  const osmStd = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', subdomains: 'abc', maxZoom: 19
  });

  L.control.layers({
    "🛰️ Esri Satellite (Default)": esriSat,
    "🚀 CARTO Voyager": cartoVoyager,
    "🗺️ OpenStreetMap Standard": osmStd
  }, null, { position: 'bottomleft' }).addTo(map);

  const layerMap = new Map();

  const geoLayer = L.geoJSON(clusterData, {
    style: function(feat) {
      const col = feat.properties.color || '#38bdf8';
      return { color: col, weight: 3, opacity: 0.95, fillColor: col, fillOpacity: 0.35 };
    },
    onEachFeature: function(feat, layer) {
      const p = feat.properties;
      const html = '<div class="pop-title">' + p.name + '</div>'
        + '<div class="pop-body">'
        + '<b>Sub-District:</b> ' + p.sub + '<br/>'
        + '<b>District:</b> ' + p.district + '<br/>'
        + '<b>Boundary Contact:</b> ' + p.contact + '<br/>'
        + '<b>Village ID:</b> ' + p.id + '<br/>'
        + '<b>Centroid:</b> ' + p.lat + ', ' + p.lng
        + '</div>';
      layer.bindPopup(html);
      
      // PERMANENT TEXT LABELS DIRECTLY ON MAP
      layer.bindTooltip(p.name, {
        permanent: true,
        direction: 'center',
        className: 'map-village-label'
      });
      
      layerMap.set(p.id, layer);
    }
  }).addTo(map);

  map.fitBounds(geoLayer.getBounds(), { padding: [40, 40] });

  const vList = document.getElementById('v-list');
  const qInput = document.getElementById('q');

  function renderList(filterTerm = '') {
    vList.innerHTML = '';
    const q = filterTerm.toLowerCase().trim();
    clusterData.features.forEach(f => {
      const p = f.properties;
      if (q && !p.name.toLowerCase().includes(q) && !p.contact.toLowerCase().includes(q)) return;
      
      const li = document.createElement('li');
      li.className = 'village-item';
      li.dataset.id = p.id;
      li.innerHTML = '<div class="v-header"><span class="v-name">' + p.name + '</span><span class="v-chip" style="background:' + p.color + '22; color:' + p.color + ';">ID ' + p.id + '</span></div>'
        + '<div class="v-meta">' + p.contact + '</div>';
      
      li.addEventListener('click', () => {
        document.querySelectorAll('.village-item').forEach(el => el.classList.remove('active'));
        li.classList.add('active');
        
        const layer = layerMap.get(p.id);
        if (layer) {
          map.fitBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 15, animate: true });
          layer.openPopup();
        }
      });
      
      vList.appendChild(li);
    });
  }

  qInput.addEventListener('input', e => renderList(e.target.value));
  renderList();
</script>
